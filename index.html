<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pug Run: Enhanced Edition</title>
    <!-- Version 1.0.21 -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-wrapper {
            position: relative;
            width: 800px;
            height: 450px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.6), 0 0 10px rgba(255, 255, 255, 0.1);
            border: 2px solid #333;
        }

        canvas {
            display: block;
            background: #000;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            font-size: 22px;
            font-weight: 800;
            text-shadow: 2px 2px 0 #000, 0 0 10px rgba(0,0,0,0.5);
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .hud > div {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            text-align: center;
            padding: 30px;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .overlay h1 {
            font-size: 48px;
            color: #f1c40f;
            margin-bottom: 15px;
            text-shadow: 3px 3px 0 #000;
            letter-spacing: -1px;
        }

        .overlay p {
            font-size: 18px;
            margin-bottom: 25px;
            max-width: 500px;
            line-height: 1.6;
            color: #e0e0e0;
        }

        .btn {
            background: linear-gradient(180deg, #2ecc71 0%, #27ae60 100%);
            color: #fff;
            border: none;
            padding: 14px 35px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #1e8449, 0 10px 10px rgba(0,0,0,0.3);
            transition: all 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(2px);
            box-shadow: 0 4px 0 #1e8449, 0 6px 6px rgba(0,0,0,0.3);
            background: linear-gradient(180deg, #3ae77f 0%, #2ecc71 100%);
        }

        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #1e8449, 0 0 0 rgba(0,0,0,0.3);
        }

        .hidden {
            display: none !important;
        }

        .controls-hint {
            margin-top: 20px;
            font-size: 13px;
            color: #888;
            background: rgba(255,255,255,0.05);
            padding: 5px 15px;
            border-radius: 15px;
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <div id="ui-layer">
        <div class="hud">
            <div id="treat-count">🦴 <span>0</span></div>
            <div id="level-display">LVL 1</div>
            <div id="lives-display">❤️ <span>5</span></div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay">
        <h1>Pug Run!</h1>
        <p>Explore beautiful worlds, collect treats, and bounce on Chihuahuas in this endless adventure.</p>
        <button class="btn" onclick="startGame()">Start Adventure</button>
        <div class="controls-hint">Controls: Arrow Keys / WASD to move & jump</div>
    </div>

    <!-- Level Complete Screen -->
    <div id="level-screen" class="overlay hidden">
        <h1 id="level-title">Level Cleared!</h1>
        <p id="level-desc">Beautiful scenery! Get ready for the next area.</p>
        <button class="btn" onclick="nextLevel()">Next Level</button>
    </div>

    <!-- Game Over Screen -->
    <div id="end-screen" class="overlay hidden">
        <h1 id="end-title">Game Over!</h1>
        <p id="end-desc">You ran out of lives!</p>
        <button class="btn" onclick="restartGame()">Play Again</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- GAME STATE ---
let gameState = 'START'; 
let currentLevel = 1;
let totalTreats = 0;
let levelStartTreats = 0; 
let playerLives = 5;
const maxLives = 5;
let cameraX = 0;
const levelWidth = 3200;

// Keys State
const keys = {
    left: false,
    right: false,
    up: false
};

// Listeners
window.addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
    if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.up = true;
});

window.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.up = false;
});

// --- THEME DEFINITIONS ---
const THEMES = ['SUNNY', 'JUNGLE', 'WINTER', 'CITY_NIGHT', 'CITY_DAY'];
let currentTheme = 'SUNNY';
let lastTheme = null;

let platforms = [];
let treats = [];
let heartPickup = null;
let enemies = [];
let finishLine = { x: 0, y: 0, w: 70, h: 70 };

// --- PARTICLE SYSTEM ---
let particles = [];

class Particle {
    constructor(x, y, type, color = null) {
        this.x = x;
        this.y = y;
        this.type = type;
        this.color = color;
        this.life = 1.0;
        
        if (type === 'dust') {
            this.vx = (Math.random() - 0.5) * 2;
            this.vy = (Math.random() - 0.5) * 2 - 1;
            this.size = Math.random() * 3 + 1;
            this.color = this.color || `rgba(255, 255, 255,`;
        } else if (type === 'snow') {
            this.vx = (Math.random() - 0.5) * 1;
            this.vy = Math.random() * 2 + 1;
            this.size = Math.random() * 4 + 2;
            this.color = `rgba(255, 255, 255,`;
        } else if (type === 'deep_snow') {
            this.vx = (Math.random() - 0.5) * 1.5;
            this.vy = Math.random() * 1.5 + 0.5;
            this.size = Math.random() * 6 + 4;
            this.color = `rgba(255, 255, 255,`;
            this.life = 1.0;
        } else if (type === 'sparkle') {
            this.vx = (Math.random() - 0.5) * 4;
            this.vy = (Math.random() - 0.5) * 4;
            this.size = Math.random() * 4 + 2;
            this.color = '#f1c40f';
            this.life = 0.6;
        } else if (type === 'firefly') {
            this.vx = (Math.random() - 0.5) * 1.5;
            this.vy = (Math.random() - 0.5) * 1.5;
            this.size = Math.random() * 3 + 2;
            this.color = '#f1c40f';
            this.life = 0.8;
            this.wanderTimer = Math.random() * 100;
        } else if (type === 'zzz') {
            this.vx = (Math.random() - 0.5) * 0.5;
            this.vy = -0.5 - Math.random() * 0.5;
            this.size = 10 + Math.random() * 4;
            this.color = '#fff';
            this.life = 1.5;
            this.rotation = Math.random() * 0.5 - 0.25;
        }
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= 0.015;
        
        if (this.type === 'snow') {
            this.vx += Math.sin(Date.now() * 0.001 + this.x) * 0.01;
        }
        
        if (this.type === 'deep_snow') {
            this.vx += Math.sin(Date.now() * 0.002 + this.x * 0.1) * 0.02;
            if (this.y > canvas.height + 20) this.y = -20;
        }

        if (this.type === 'firefly') {
            this.wanderTimer++;
            if (this.wanderTimer % 60 === 0) {
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
            }
            if (Math.random() > 0.9) this.life = 0.8; 
        }
    }

    draw() {
        if (this.type === 'zzz') {
            ctx.save();
            ctx.translate(this.x - cameraX, this.y);
            ctx.rotate(this.rotation);
            ctx.fillStyle = this.color;
            ctx.globalAlpha = Math.min(1, this.life);
            ctx.font = `bold ${this.size}px sans-serif`;
            ctx.fillText('Z', 0, 0);
            ctx.restore();
            ctx.globalAlpha = 1.0;
        } else if (this.type === 'sparkle' || this.type === 'firefly') {
            ctx.fillStyle = this.color;
            ctx.globalAlpha = this.life;
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.color;
            ctx.beginPath();
            ctx.arc(this.x - cameraX, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1.0;
        } else {
            ctx.fillStyle = this.color + this.life + ')';
            ctx.beginPath();
            ctx.arc(this.x - cameraX, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

// --- PLAYER (PUG) ---
const player = {
    x: 100,
    y: 200,
    w: 36,
    h: 30,
    vx: 0,
    vy: 0,
    speed: 8.5,
    jumpPower: -13.5,
    gravity: 0.55,
    grounded: false,
    facing: 'right',
    animFrame: 0,
    animTimer: 0,
    invincibleTimer: 0,
    dustTimer: 0,
    idleTimer: 0,
    isSleeping: false,

    reset(x, y) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.grounded = false;
        this.invincibleTimer = 60; 
        this.idleTimer = 0;
        this.isSleeping = false;
        particles = [];
    },

    update() {
        if (this.invincibleTimer > 0) this.invincibleTimer--;

        // Movement
        if (keys.left) {
            this.vx = -this.speed;
            this.facing = 'left';
        } else if (keys.right) {
            this.vx = this.speed;
            this.facing = 'right';
        } else {
            this.vx *= 0.7; 
        }

        if (keys.up && this.grounded) {
            this.vy = this.jumpPower;
            this.grounded = false;
            for(let i=0; i<5; i++) {
                particles.push(new Particle(this.x + this.w/2, this.y + this.h, 'dust', getDustColor()));
            }
        }

        // Apply Gravity
        this.vy += this.gravity;

        // X Position & Collision
        this.x += this.vx;
        if (this.x < 0) this.x = 0;

        // Y Position & Collision
        this.y += this.vy;
        this.grounded = false;

        // Platform Collisions
        platforms.forEach(p => {
            if (this.x + this.w > p.x && 
                this.x < p.x + p.w && 
                this.y + this.h >= p.y && 
                this.y + this.h <= p.y + p.h + this.vy &&
                this.vy >= 0) {
                this.y = p.y - this.h;
                this.vy = 0;
                this.grounded = true;
            }
        });

        // Bottom Boundary
        if (this.y > canvas.height + 100) {
            loseLife();
        }

        // Idle & Sleep Logic
        if (Math.abs(this.vx) > 0.2 && this.grounded) {
            this.idleTimer = 0;
            this.isSleeping = false;
        } else if (this.grounded) {
            this.idleTimer++;
            if (this.idleTimer > 600) { // 10 seconds at 60fps
                this.isSleeping = true;
                if (Math.random() > 0.95) {
                    particles.push(new Particle(this.x + this.w/2, this.y, 'zzz'));
                }
            }
        }

        // Animation timing
        if (Math.abs(this.vx) > 0.2 && this.grounded) {
            this.animTimer++;
            if (this.animTimer % 12 === 0) {
                this.animFrame = (this.animFrame + 1) % 2;
            }
            this.dustTimer++;
            if (this.dustTimer % 5 === 0) {
                particles.push(new Particle(this.x + this.w/2, this.y + this.h, 'dust', getDustColor()));
            }
        } else {
            this.animFrame = 0;
            this.dustTimer = 0;
        }
    },

    draw() {
        if (this.invincibleTimer % 10 > 5) return;

        ctx.save();
        ctx.translate(this.x - cameraX + this.w / 2, this.y + this.h / 2);
        if (this.facing === 'left') {
            ctx.scale(-1, 1);
        }

        const coatColor = '#d7be82'; 
        const darkMaskColor = '#2c2523'; 
        const detailColor = '#b59a5b'; 

        if (this.isSleeping) {
            ctx.fillStyle = coatColor;
            ctx.beginPath();
            ctx.roundRect(-14, -4, 24, 16, 8);
            ctx.fill();
            
            ctx.strokeStyle = darkMaskColor;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(6, -8);
            ctx.quadraticCurveTo(10, -6, 14, -8);
            ctx.stroke();
            
            ctx.strokeStyle = detailColor;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(-14, -2, 3, 0, Math.PI * 1.5);
            ctx.stroke();
            
            ctx.fillStyle = darkMaskColor;
            ctx.beginPath();
            ctx.roundRect(8, -2, 8, 6, 3);
            ctx.fill();
        } else {
            ctx.fillStyle = coatColor;
            ctx.beginPath();
            ctx.roundRect(-16, -8, 28, 18, 6);
            ctx.fill();

            ctx.fillStyle = detailColor;
            let legOffset = this.animFrame === 1 ? 3 : 0;
            ctx.fillRect(-12 + legOffset, 8, 6, 8);
            ctx.fillRect(4 - legOffset, 8, 6, 8);

            ctx.strokeStyle = detailColor;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(-16, -6, 4, 0, Math.PI * 1.5);
            ctx.stroke();

            ctx.fillStyle = coatColor;
            ctx.beginPath();
            ctx.moveTo(-1, -6); 
            ctx.quadraticCurveTo(0, -18, 8, -19); 
            ctx.quadraticCurveTo(16, -19, 18, -12); 
            ctx.quadraticCurveTo(19, -5, 15, -1); 
            ctx.quadraticCurveTo(8, 2, 0, -1); 
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = darkMaskColor;
            ctx.beginPath();
            ctx.roundRect(8, -7, 10, 10, 4);
            ctx.fill();

            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(16, -4, 1.8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = darkMaskColor;
            ctx.beginPath();
            ctx.ellipse(3, -16, 4, 7, Math.PI / 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(11, -15, 3.5, 6, -Math.PI / 10, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(10, -11, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(11.5, -11, 2.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(12.5, -12, 1, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.restore();
    }
};

// --- CHIHUAHUA ENEMY CLASS ---
class Chihuahua {
    constructor(x, y, patrolRange) {
        this.x = x;
        this.y = y;
        this.w = 30;
        this.h = 26;
        this.startX = x;
        this.patrolRange = patrolRange;
        this.vx = 1.3; 
        this.scared = false;
        this.vy = 0;
        this.barkTimer = Math.random() * 100;
        this.animFrame = 0;
        this.animTimer = 0;
    }

    update() {
        if (this.scared) {
            this.x += this.vx * 3;
            this.y += this.vy;
            this.vy += 0.2; 
            return;
        }

        this.x += this.vx;
        if (this.x > this.startX + this.patrolRange || this.x < this.startX) {
            this.vx *= -1; 
        }

        this.barkTimer++;

        this.animTimer++;
        if (this.animTimer % 8 === 0) {
            this.animFrame = (this.animFrame + 1) % 2;
        }
    }

    scareAway() {
        this.scared = true;
        this.vy = -5; 
        this.vx = player.facing === 'right' ? 3 : -3;
    }

    draw() {
        let rx = this.x - cameraX;
        let ry = this.y;

        ctx.save();
        ctx.translate(rx + this.w / 2, ry + this.h / 2);
        if (this.vx < 0 && !this.scared) {
            ctx.scale(-1, 1);
        }

        const tanColor = '#e0a96d';
        const blackCoat = '#252323';
        const innerEarColor = '#f3a6a6';

        ctx.fillStyle = tanColor;
        ctx.beginPath();
        ctx.roundRect(-12, -6, 22, 14, 4);
        ctx.fill();

        ctx.fillStyle = blackCoat;
        ctx.beginPath();
        ctx.roundRect(-12, -7, 18, 9, 3);
        ctx.fill();

        ctx.fillStyle = tanColor;
        let legOff = (!this.scared && this.animFrame === 1) ? 3 : 0;
        ctx.fillRect(-10 + legOff, 7, 4, 8);
        ctx.fillRect(4 - legOff, 7, 4, 8);

        ctx.strokeStyle = blackCoat;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-12, -4);
        ctx.lineTo(-17, -12);
        ctx.stroke();

        ctx.fillStyle = tanColor;
        ctx.beginPath();
        ctx.moveTo(0, -6);
        ctx.quadraticCurveTo(2, -18, 10, -18);
        ctx.quadraticCurveTo(16, -16, 17, -8);
        ctx.quadraticCurveTo(15, 0, 8, 0);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = blackCoat;
        ctx.beginPath();
        ctx.moveTo(1, -11);
        ctx.quadraticCurveTo(2, -18, 10, -18);
        ctx.quadraticCurveTo(15, -17, 15, -11);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = blackCoat;
        ctx.beginPath();
        ctx.moveTo(2, -14);
        ctx.lineTo(5, -26);
        ctx.lineTo(11, -15);
        ctx.fill();

        ctx.fillStyle = innerEarColor;
        ctx.beginPath();
        ctx.moveTo(4, -15);
        ctx.lineTo(6, -23);
        ctx.lineTo(9, -16);
        ctx.fill();

        ctx.fillStyle = tanColor;
        ctx.beginPath();
        ctx.roundRect(12, -8, 7, 5, 2);
        ctx.fill();

        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(18, -7, 1.2, 0, Math.PI * 2);
        ctx.fill();

        if (this.scared) {
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(10, -10, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(10, -10, 2, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(10, -10, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(10.5, -10, 1.8, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(11.2, -11, 0.7, 0, Math.PI * 2);
            ctx.fill();
        }

        if (!this.scared && Math.floor(this.barkTimer / 30) % 2 === 0) {
            ctx.fillStyle = '#f1c40f';
            ctx.font = 'bold 11px sans-serif';
            ctx.fillText('WOOF!', 8, -25);
        }

        ctx.restore();
    }
}

// --- MULTI-LAYER PARALLAX BACKGROUND DRAWING ---
function drawParallaxBackground() {
    let bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    
    switch (currentTheme) {
        case 'SUNNY':
            bgGradient.addColorStop(0, '#4facfe');
            bgGradient.addColorStop(1, '#00f2fe');
            ctx.fillStyle = bgGradient; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#fff7b1'; 
            ctx.shadowBlur = 50; ctx.shadowColor = '#f1c40f';
            ctx.beginPath(); ctx.arc(650, 80, 40, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
            
            drawClouds(0.1, '#ffffff');
            drawDistantHills(0.18, '#81c784', 220, 45, 600);
            drawParallaxTrees(0.26, '#2e7d32', false);
            drawDistantHills(0.35, '#4caf50', 280, 35, 400);
            drawSecondaryGround(0.5, '#388e3c'); 
            break;

        case 'JUNGLE':
            bgGradient.addColorStop(0, '#56ab2f');
            bgGradient.addColorStop(0.5, '#a8e063');
            bgGradient.addColorStop(1, '#2e7d32');
            ctx.fillStyle = bgGradient; ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawTallJungleMountains(0.08, '#3e352f'); 
            drawDistantMountains(0.15, '#195b4e', 240, 350);
            drawJungleCanopy(0.3, '#0b382d');
            drawSecondaryGround(0.5, '#1e4d3a'); 
            
            if (Math.random() > 0.98) {
                particles.push(new Particle(Math.random() * canvas.width + cameraX, Math.random() * canvas.height * 0.8, 'firefly'));
            }
            break;

        case 'WINTER':
            bgGradient.addColorStop(0, '#1c2833');
            bgGradient.addColorStop(1, '#4a6572');
            ctx.fillStyle = bgGradient; ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawClouds(0.15, 'rgba(255, 255, 255, 0.1)');
            drawWinterMountains(0.10, '#10171e'); // High contrast dark mountains standing out through the haze
            drawParallaxTrees(0.22, '#2e7d32', true); 
            
            // Heavy Blizzard Snow Haze Layer over the tree line
            ctx.fillStyle = 'rgba(220, 230, 242, 0.38)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawSnowDrifts(0.35, '#e2e8f0'); 
            drawSecondaryGround(0.5, '#2c3e50'); 
            
            if (Math.random() > 0.7) {
                particles.push(new Particle(cameraX + Math.random() * canvas.width, -10, 'snow'));
            }
            if (Math.random() > 0.6) {
                particles.push(new Particle(cameraX + Math.random() * canvas.width, -20, 'deep_snow'));
            }
            break;

        case 'CITY_NIGHT':
            bgGradient.addColorStop(0, '#0f2027');
            bgGradient.addColorStop(1, '#203a43');
            ctx.fillStyle = bgGradient; ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#fff';
            for(let i=0; i<60; i++) {
                let sx = (Math.sin(i * 132) * 10000) % canvas.width;
                let sy = (Math.cos(i * 456) * 10000) % (canvas.height * 0.6);
                if (sx < 0) sx += canvas.width;
                if (sy < 0) sy += canvas.height * 0.6;
                ctx.fillRect(sx, sy, 1.5, 1.5);
            }

            ctx.fillStyle = '#f5f6fa'; ctx.beginPath(); ctx.arc(150, 70, 30, 0, Math.PI * 2); ctx.fill();
            
            drawClouds(0.15, 'rgba(20, 30, 40, 0.6)');
            drawSkyline(0.15, '#111923', true, 260, true);  
            drawSkyline(0.3, '#1c2833', true, 200, false);
            drawSecondaryGround(0.5, '#243342'); 
            break;

        case 'CITY_DAY':
            bgGradient.addColorStop(0, '#2c3e50');
            bgGradient.addColorStop(0.5, '#4ca1af');
            bgGradient.addColorStop(1, '#c4e0e5');
            ctx.fillStyle = bgGradient; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawClouds(0.2, 'rgba(255, 255, 255, 0.4)');
            drawSkyline(0.15, '#5d768d', false, 240, true);  
            drawSkyline(0.3, '#3f5166', false, 180, false);
            drawSecondaryGround(0.5, '#52667a'); 
            break;
    }

    // --- UNIVERSAL ATMOSPHERIC HAZE LAYER ---
    if (currentTheme !== 'WINTER') {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
}

// --- PARALLAX HELPER FUNCTIONS ---

function drawClouds(factor, color) {
    ctx.fillStyle = color;
    let loopWidth = 600;
    let offset = (cameraX * factor) % loopWidth;
    for (let x = -loopWidth; x < canvas.width + loopWidth; x += 300) {
        let rx = x - offset;
        ctx.beginPath();
        ctx.arc(rx, 100, 25, 0, Math.PI * 2); 
        ctx.arc(rx + 25, 90, 35, 0, Math.PI * 2); 
        ctx.arc(rx + 55, 100, 25, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawSecondaryGround(factor, color) {
    ctx.fillStyle = color;
    let offset = (cameraX * factor);
    let baseY = 405; 

    ctx.beginPath();
    ctx.moveTo(-50, canvas.height);

    for (let x = -50; x <= canvas.width + 50; x += 20) {
        let worldX = x + offset;
        let y = baseY + Math.sin(worldX / 150 * Math.PI * 2) * 8;
        ctx.lineTo(x, y);
    }

    ctx.lineTo(canvas.width + 50, canvas.height);
    ctx.closePath();
    ctx.fill();
}

function drawDistantHills(factor, color, baseY, amplitude, wavelength) {
    ctx.fillStyle = color;
    let offset = (cameraX * factor);
    
    ctx.beginPath();
    ctx.moveTo(-50, canvas.height);
    
    for (let x = -50; x <= canvas.width + 50; x += 10) {
        let worldX = x + offset;
        let y = baseY + Math.sin(worldX / wavelength * Math.PI * 2) * amplitude;
        ctx.lineTo(x, y);
    }
    
    ctx.lineTo(canvas.width + 50, canvas.height);
    ctx.closePath();
    ctx.fill();
}

function drawWinterMountains(factor, color) {
    ctx.fillStyle = color;
    let spacing = 450;
    let offset = (cameraX * factor) % spacing;

    ctx.beginPath();
    ctx.moveTo(-spacing, canvas.height);
    for (let x = -spacing; x < canvas.width + spacing * 2; x += spacing) {
        let rx = x - offset;
        ctx.lineTo(rx + spacing * 0.25, 80);
        ctx.lineTo(rx + spacing * 0.45, 140);
        ctx.lineTo(rx + spacing * 0.65, 60);
        ctx.lineTo(rx + spacing * 0.85, 120);
        ctx.lineTo(rx + spacing, canvas.height);
    }
    ctx.closePath();
    ctx.fill();
}

function drawSnowDrifts(factor, color) {
    ctx.fillStyle = color;
    let offset = (cameraX * factor);
    let baseY = 350;

    ctx.beginPath();
    ctx.moveTo(-50, canvas.height);

    for (let x = -50; x <= canvas.width + 50; x += 15) {
        let worldX = x + offset;
        let y = baseY + Math.sin(worldX / 220 * Math.PI * 2) * 16 + Math.cos(worldX / 90 * Math.PI) * 8;
        ctx.lineTo(x, y);
    }

    ctx.lineTo(canvas.width + 50, canvas.height);
    ctx.closePath();
    ctx.fill();
}

function drawTallJungleMountains(factor, color) {
    ctx.fillStyle = color;
    let spacing = 520;
    let offset = (cameraX * factor) % spacing;

    ctx.beginPath();
    ctx.moveTo(-spacing, canvas.height);
    for (let x = -spacing; x < canvas.width + spacing * 2; x += spacing) {
        let rx = x - offset;
        ctx.lineTo(rx + spacing * 0.35, 75);
        ctx.lineTo(rx + spacing * 0.55, 120);
        ctx.lineTo(rx + spacing * 0.75, 60);
        ctx.lineTo(rx + spacing, canvas.height);
    }
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = 'rgba(168, 224, 99, 0.12)';
    ctx.fillRect(0, 40, canvas.width, canvas.height - 40);
}

function drawParallaxTrees(factor, foliageColor, hasSnow) {
    let loopWidth = 900;
    let offset = (cameraX * factor) % loopWidth;
    let groundY = 380;
    let bottomY = canvas.height + 50; 

    for (let x = -loopWidth; x < canvas.width + loopWidth * 2; x += 75) {
        let rx = x - offset;
        let treeIdx = Math.floor((x + loopWidth) / 75);
        
        let treeHeight = 120 + (Math.abs(Math.sin(treeIdx * 11.3)) * 100); 
        let treeWidth = 30 + (Math.abs(Math.cos(treeIdx * 4.7)) * 20);
        let topY = groundY - treeHeight;

        // Trunk - slightly translucent during snow for atmospheric haze depth
        ctx.fillStyle = hasSnow ? 'rgba(74, 46, 27, 0.45)' : '#4a2e1b';
        ctx.fillRect(rx + (treeWidth / 2) - 4, topY, 8, bottomY - topY);

        // Tiered Foliage
        for (let tier = 0; tier < 3; tier++) {
            let tierY = topY + (tier * 35);
            let tierWidth = treeWidth * (1 + tier * 0.35);

            // Green Branch Tier
            ctx.fillStyle = foliageColor;
            ctx.beginPath();
            ctx.moveTo(rx + (treeWidth / 2) - (tierWidth / 2), tierY + 30);
            ctx.lineTo(rx + treeWidth / 2, tierY - 25);
            ctx.lineTo(rx + (treeWidth / 2) + (tierWidth / 2), tierY + 30);
            ctx.closePath();
            ctx.fill();

            // Precise White Snow Layer on top of branch parts
            if (hasSnow) {
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(rx + (treeWidth / 2) - (tierWidth / 2.2), tierY + 18);
                ctx.lineTo(rx + treeWidth / 2, tierY - 25);
                ctx.lineTo(rx + (treeWidth / 2) + (tierWidth / 2.2), tierY + 18);
                ctx.lineTo(rx + (treeWidth / 2) + (tierWidth / 2.8), tierY + 23);
                ctx.lineTo(rx + treeWidth / 2, tierY - 12);
                ctx.lineTo(rx + (treeWidth / 2) - (tierWidth / 2.8), tierY + 23);
                ctx.closePath();
                ctx.fill();

                // Tree haze overlay to soften the green foliage into the snow storm
                ctx.fillStyle = 'rgba(236, 240, 241, 0.28)';
                ctx.beginPath();
                ctx.moveTo(rx + (treeWidth / 2) - (tierWidth / 2), tierY + 30);
                ctx.lineTo(rx + treeWidth / 2, tierY - 25);
                ctx.lineTo(rx + (treeWidth / 2) + (tierWidth / 2), tierY + 30);
                ctx.closePath();
                ctx.fill();
            }
        }
    }
}

function drawDistantMountains(factor, color, peakY, spacing) {
    ctx.fillStyle = color;
    let offset = (cameraX * factor) % spacing;
    
    ctx.beginPath();
    ctx.moveTo(-spacing, canvas.height);
    for (let x = -spacing; x < canvas.width + spacing * 2; x += spacing) {
        let rx = x - offset;
        ctx.lineTo(rx + spacing / 2, peakY);
        ctx.lineTo(rx + spacing, canvas.height);
    }
    ctx.closePath();
    ctx.fill();
}

function drawJungleCanopy(factor, color) {
    ctx.fillStyle = color;
    let loopWidth = 400;
    let offset = (cameraX * factor) % loopWidth;

    for (let x = -loopWidth; x < canvas.width + loopWidth * 2; x += loopWidth) {
        let rx = x - offset;
        
        ctx.fillRect(rx - 10, 280, 120, canvas.height - 280);
        ctx.fillRect(rx + 95, 260, 170, canvas.height - 260);
        ctx.fillRect(rx + 245, 285, 130, canvas.height - 285);

        ctx.beginPath();
        ctx.arc(rx + 50, 280, 60, 0, Math.PI * 2);
        ctx.arc(rx + 180, 260, 85, 0, Math.PI * 2);
        ctx.arc(rx + 310, 285, 65, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawSkyline(factor, color, isNight, heightScale, isBackground = false) {
    ctx.fillStyle = color;
    let buildingWidth = isBackground ? 75 : 90;
    let spacing = isBackground ? 150 : 180; 
    let loopWidth = spacing * 6;
    let offset = (cameraX * factor) % loopWidth;

    for (let x = -loopWidth; x < canvas.width + loopWidth; x += spacing) {
        let rx = x - offset;
        let worldX = Math.floor((rx + cameraX * factor) / spacing);
        let h = heightScale + (Math.abs(Math.sin(worldX * 2.1)) * (isBackground ? 90 : 70));

        ctx.fillRect(rx, canvas.height - h, buildingWidth, h);
        
        if (isNight) {
            ctx.fillStyle = '#f1c40f'; 
        } else {
            ctx.fillStyle = '#d4e6f1'; 
        }

        let col = 0;
        for (let wx = rx + 10; wx < rx + buildingWidth - 15; wx += 18) {
            let row = 0;
            for (let wy = canvas.height - h + 15; wy < canvas.height - 20; wy += 22) {
                let windowId = Math.abs(worldX * 17 + col * 7 + row * 13);
                if (windowId % 3 !== 0) {
                    ctx.fillRect(wx, wy, 8, 11);
                }
                row++;
            }
            col++;
        }

        if (isBackground) {
            ctx.fillStyle = isNight ? 'rgba(15, 32, 39, 0.5)' : 'rgba(196, 224, 229, 0.5)';
            ctx.fillRect(rx, canvas.height - h, buildingWidth, h);
        }

        ctx.fillStyle = color;
    }
}

// --- LEVEL GENERATION & RANDOMIZATION ---

function getDustColor() {
    switch (currentTheme) {
        case 'SUNNY': return 'rgba(141, 85, 36,';
        case 'JUNGLE': return 'rgba(44, 62, 80,';
        case 'WINTER': return 'rgba(236, 240, 241,';
        case 'CITY_NIGHT': case 'CITY_DAY': return 'rgba(127, 140, 141,';
        default: return 'rgba(255, 255, 255,';
    }
}

function populateLevelObjects() {
    treats = [];
    enemies = [];
    heartPickup = null;
    let validEnemyPlatforms = [];
    let validHeartPlatforms = [];

    platforms.forEach(plat => {
        if (plat.y === 380 && plat.x > 400 && plat.x < levelWidth - 400) {
            validEnemyPlatforms.push(plat);
        }

        if (plat.h === 70) {
            for (let t = plat.x + 60; t < plat.x + plat.w - 30; t += 90) {
                if (Math.random() > 0.4) {
                    treats.push({ x: t, y: 340, collected: false, floatOffset: Math.random() * 10 });
                }
            }
        } else {
            validHeartPlatforms.push(plat);

            if (plat.y === 280) {
                treats.push({ x: plat.x + plat.w / 2, y: plat.y - 35, collected: false, floatOffset: Math.random() * 10 });
            } else if (plat.y === 180) {
                treats.push({ x: plat.x + 20, y: plat.y - 35, collected: false, floatOffset: Math.random() * 10 });
                treats.push({ x: plat.x + plat.w - 20, y: plat.y - 35, collected: false, floatOffset: Math.random() * 10 });
            }
        }
    });

    if (validHeartPlatforms.length > 0) {
        let heartPlat = validHeartPlatforms[Math.floor(Math.random() * validHeartPlatforms.length)];
        heartPickup = {
            x: heartPlat.x + heartPlat.w / 2,
            y: heartPlat.y - 35,
            collected: false,
            floatOffset: Math.random() * 10
        };
    }

    let numEnemies = Math.floor(Math.random() * 3) + 1; 
    for (let i = 0; i < numEnemies; i++) {
        if (validEnemyPlatforms.length > 0) {
            let idx = Math.floor(Math.random() * validEnemyPlatforms.length);
            let targetPlat = validEnemyPlatforms.splice(idx, 1)[0];
            enemies.push(new Chihuahua(targetPlat.x + 30, targetPlat.y - 26, targetPlat.w - 60));
        }
    }
}

function generateLevel() {
    platforms = [];
    
    // Pick a random theme, ensuring it doesn't repeat the previous one
    let availableThemes = THEMES.filter(t => t !== lastTheme);
    currentTheme = availableThemes[Math.floor(Math.random() * availableThemes.length)];
    lastTheme = currentTheme;

    let x = 0;
    while (x < levelWidth) {
        let pWidth = 200 + Math.random() * 200; 
        if (x === 0) pWidth = 450; 
        
        let plat = { x: x, y: 380, w: pWidth, h: 70 };
        platforms.push(plat);

        if (x > 250 && x < levelWidth - 400) {
            let midY = 280;
            let midW = 100 + Math.random() * 80;
            let midX = x + 30;
            platforms.push({ x: midX, y: midY, w: midW, h: 20 });

            if (Math.random() > 0.4) {
                let highY = 180;
                let highW = 90 + Math.random() * 60;
                let highX = midX + 40;
                platforms.push({ x: highX, y: highY, w: highW, h: 20 });
            }
        }

        x += pWidth + (80 + Math.random() * 50); 
    }

    finishLine = { x: levelWidth - 200, y: 310, w: 70, h: 70 };
    platforms.push({ x: levelWidth - 300, y: 380, w: 300, h: 70 });

    populateLevelObjects();
    player.reset(100, 200);
}

function loseLife() {
    playerLives--;
    totalTreats = levelStartTreats;
    updateHUD();

    if (playerLives <= 0) {
        showGameOver();
    } else {
        populateLevelObjects();
        player.reset(100, 200);
    }
}

function updateHUD() {
    document.getElementById('treat-count').innerHTML = `🦴 <span>${totalTreats}</span>`;
    document.getElementById('lives-display').innerHTML = `❤️ <span>${playerLives}</span>`;
    document.getElementById('level-display').innerText = `LVL ${currentLevel}`;
}

// --- RENDERING & COLLISIONS ---
function drawPlatforms() {
    platforms.forEach(p => {
        let rx = p.x - cameraX;
        
        switch (currentTheme) {
            case 'SUNNY': 
                ctx.fillStyle = '#5cd38c'; ctx.fillRect(rx, p.y, p.w, 12); ctx.fillStyle = '#8d5524'; ctx.fillRect(rx, p.y + 12, p.w, p.h - 12); break;
            case 'JUNGLE': 
                ctx.fillStyle = '#27ae60'; ctx.fillRect(rx, p.y, p.w, 15); ctx.fillStyle = '#2c3e50'; ctx.fillRect(rx, p.y + 15, p.w, p.h - 15); break;
            case 'WINTER': 
                ctx.fillStyle = '#ecf0f1'; ctx.fillRect(rx, p.y, p.w, 14); ctx.fillStyle = '#34495e'; ctx.fillRect(rx, p.y + 14, p.w, p.h - 14); break;
            case 'CITY_NIGHT': case 'CITY_DAY': 
                ctx.fillStyle = '#7f8c8d'; ctx.fillRect(rx, p.y, p.w, p.h); ctx.fillStyle = '#95a5a6'; ctx.fillRect(rx, p.y, p.w, 6); break;
        }

        if (currentTheme === 'SUNNY') {
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fillRect(rx, p.y, p.w, 4);
        } else if (currentTheme === 'WINTER') {
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.fillRect(rx, p.y, p.w, 4);
        } else if (currentTheme === 'CITY_NIGHT') {
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.fillRect(rx, p.y, p.w, 2);
        }
    });
}

function drawTreats() {
    let time = Date.now() * 0.003;
    treats.forEach(t => {
        if (t.collected) return;
        let rx = t.x - cameraX;
        let ry = t.y + Math.sin(time + t.floatOffset) * 4;
        
        ctx.fillStyle = '#f39c12';
        ctx.beginPath(); ctx.roundRect(rx - 10, ry - 4, 20, 8, 3); ctx.fill();
        ctx.beginPath(); ctx.arc(rx - 10, ry - 4, 5, 0, Math.PI * 2); ctx.arc(rx - 10, ry + 4, 5, 0, Math.PI * 2); ctx.arc(rx + 10, ry - 4, 5, 0, Math.PI * 2); ctx.arc(rx + 10, ry + 4, 5, 0, Math.PI * 2); ctx.fill();
        
        if (player.x < t.x + 15 && player.x + player.w > t.x - 15 && player.y < ry + 15 && player.y + player.h > ry - 15) {
            t.collected = true; totalTreats++; updateHUD();
            for(let i=0; i<8; i++) {
                particles.push(new Particle(t.x, t.y, 'sparkle'));
            }
        }
    });
}

function drawHeartPickup() {
    if (!heartPickup || heartPickup.collected) return;

    let time = Date.now() * 0.004;
    let rx = heartPickup.x - cameraX;
    let ry = heartPickup.y + Math.sin(time + heartPickup.floatOffset) * 5;

    ctx.save();
    ctx.translate(rx, ry);

    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.arc(-5, -4, 6, Math.PI, 0);
    ctx.arc(5, -4, 6, Math.PI, 0);
    ctx.lineTo(0, 8);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-4, -5, 1.8, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    if (player.x < heartPickup.x + 18 && player.x + player.w > heartPickup.x - 18 &&
        player.y < ry + 18 && player.y + player.h > ry - 18) {
        
        heartPickup.collected = true;
        if (playerLives < maxLives) {
            playerLives++;
        }
        totalTreats += 10; 
        updateHUD();
        for(let i=0; i<10; i++) {
            particles.push(new Particle(heartPickup.x, heartPickup.y, 'sparkle'));
        }
    }
}

function handleEnemies() {
    enemies.forEach(e => {
        e.update();
        e.draw();
        if (e.scared) return;
        if (player.x < e.x + e.w && player.x + player.w > e.x && player.y < e.y + e.h && player.y + player.h > e.y) {
            if (player.vy > 0 && player.y + player.h - player.vy <= e.y + 8) {
                e.scareAway();
                player.vy = player.jumpPower * 0.8; 
                totalTreats += 5; 
                updateHUD();
            } else if (player.invincibleTimer <= 0) {
                totalTreats = levelStartTreats;
                player.invincibleTimer = 60; 
                updateHUD();
            }
        }
    });
}

function drawFinishLine() {
    let rx = finishLine.x - cameraX;
    let ry = finishLine.y;

    // Doghouse Body
    ctx.fillStyle = '#a0522d'; 
    ctx.fillRect(rx, ry + 20, finishLine.w, finishLine.h - 20);

    // Doghouse Roof
    ctx.fillStyle = '#8b0000';
    ctx.beginPath();
    ctx.moveTo(rx - 10, ry + 22);
    ctx.lineTo(rx + finishLine.w / 2, ry - 10);
    ctx.lineTo(rx + finishLine.w + 10, ry + 22);
    ctx.closePath();
    ctx.fill();

    // Doghouse Door Entrance
    let doorX = rx + 20;
    let doorW = 30;
    let doorY = ry + 32;
    let doorH = finishLine.h - 32;

    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(doorX + doorW / 2, doorY + 10, doorW / 2, Math.PI, 0);
    ctx.fillRect(doorX, doorY + 10, doorW, doorH - 10);
    ctx.fill();

    // Bone Sign
    ctx.fillStyle = '#f5f5dc';
    ctx.beginPath();
    ctx.roundRect(rx + 20, ry + 8, 30, 8, 4);
    ctx.fill();

    // Trigger Win only when pug enters opening
    let pugCenterX = player.x + player.w / 2;
    let doorWorldLeft = finishLine.x + 20;
    let doorWorldRight = finishLine.x + 50;

    if (pugCenterX >= doorWorldLeft && pugCenterX <= doorWorldRight && player.grounded && player.y + player.h >= finishLine.y + 30) {
        showLevelClear();
    }
}

// --- FIXED TIMESTEP GAME LOOP ---
let lastTime = performance.now();
let accumulator = 0;
const physicsStep = 1000 / 60;

function updateGameLogic() {
    if (gameState === 'PLAYING') {
        player.update();
        
        // Camera Tracking
        cameraX = player.x - 200;
        if (cameraX < 0) cameraX = 0;
        if (cameraX > levelWidth - canvas.width) cameraX = levelWidth - canvas.width;
        
        // Update Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            if (particles[i].life <= 0) {
                particles.splice(i, 1);
            }
        }
    }
}

function renderGame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    drawParallaxBackground();
    drawPlatforms();
    drawTreats();
    drawHeartPickup();
    handleEnemies();
    drawFinishLine();
    
    // Draw Particles
    particles.forEach(p => p.draw());
    
    player.draw();
}

function gameLoop(now) {
    let dt = now - lastTime;
    lastTime = now;

    if (dt > 250) dt = 250;

    accumulator += dt;

    while (accumulator >= physicsStep) {
        updateGameLogic();
        accumulator -= physicsStep;
    }

    renderGame();
    requestAnimationFrame(gameLoop);
}

// --- STATE MANAGEMENT ---
function startGame() {
    totalTreats = 0; 
    levelStartTreats = 0;
    playerLives = 5; 
    currentLevel = 1; 
    lastTheme = null;
    updateHUD();
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('end-screen').classList.add('hidden');
    loadLevel(currentLevel);
    gameState = 'PLAYING';
}

function loadLevel(lvl) {
    levelStartTreats = totalTreats; 
    updateHUD();
    generateLevel();
}

function showLevelClear() {
    gameState = 'LEVEL_CLEAR';
    document.getElementById('level-title').innerText = `Level ${currentLevel} Complete!`;
    document.getElementById('level-desc').innerText = `You've collected ${totalTreats} treats! Ready for the next world?`;
    document.getElementById('level-screen').classList.remove('hidden');
}

function nextLevel() {
    currentLevel++;
    document.getElementById('level-screen').classList.add('hidden');
    loadLevel(currentLevel);
    gameState = 'PLAYING';
}

function showGameOver() {
    gameState = 'GAME_OVER';
    document.getElementById('end-desc').innerText = `You ran out of lives! Total treats banked: ${totalTreats}`;
    document.getElementById('end-screen').classList.remove('hidden');
}

function restartGame() {
    startGame();
}

// Start Game Loop
requestAnimationFrame(gameLoop);

</script>
