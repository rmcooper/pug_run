<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pug Run: Endless Treat Collector</title>
    <!-- Version 1.1.0 -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 450px;
            border: 4px solid #fff;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            text-align: center;
            padding: 20px;
        }

        .overlay h1 {
            font-size: 42px;
            color: #f1c40f;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0 #000;
        }

        .overlay p {
            font-size: 18px;
            margin-bottom: 20px;
            max-width: 500px;
            line-height: 1.4;
        }

        .btn {
            background: #2ecc71;
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 0 #27ae60;
            transition: all 0.1s ease;
        }

        .btn:hover {
            background: #27ae60;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1e8449;
        }

        .hidden {
            display: none !important;
        }

        .controls-hint {
            margin-top: 15px;
            font-size: 14px;
            color: #ccc;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <div id="ui-layer">
        <div class="hud">
            <div id="treat-count">🦴 Treats: 0</div>
            <div id="lives-display">❤️ Lives: 5</div>
            <div id="level-display">Level 1</div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay">
        <h1>Pug Run!</h1>
        <p>Help the little pug collect treats and scare away feisty Chihuahuas across infinite randomized levels!</p>
        <button class="btn" onclick="startGame()">Start Game</button>
        <div class="controls-hint">Controls: Arrow Keys / WASD to move & jump</div>
    </div>

    <!-- Level Complete Screen -->
    <div id="level-screen" class="overlay hidden">
        <h1 id="level-title">Level Cleared!</h1>
        <p id="level-desc">Great job! Get ready for the next area.</p>
        <button class="btn" onclick="nextLevel()">Next Level</button>
    </div>

    <!-- Game Over Screen -->
    <div id="end-screen" class="overlay hidden">
        <h1 id="end-title">Game Over!</h1>
        <p id="end-desc">You ran out of lives!</p>
        <button class="btn" onclick="restartGame()">Play Again</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- GAME STATE ---
let gameState = 'START'; 
let currentLevel = 1;
let totalTreats = 0;
let levelStartTreats = 0; 
let playerLives = 5;
const maxLives = 5;
let cameraX = 0;
const levelWidth = 3200;

// Keys State
const keys = {
    left: false,
    right: false,
    up: false
};

// Listeners
window.addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
    if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.up = true;
});

window.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.up = false;
});

// --- THEME DEFINITIONS ---
const THEMES = ['SUNNY', 'JUNGLE', 'WINTER', 'CITY_NIGHT', 'CITY_DAY'];

let currentTheme = 'SUNNY';
let platforms = [];
let treats = [];
let heartPickup = null;
let enemies = [];
let finishLine = { x: 0, y: 0, w: 40, h: 80 };

// Atmospheric Particles
let particles = [];

// --- PLAYER (PUG) ---
const player = {
    x: 100,
    y: 200,
    w: 36,
    h: 30,
    vx: 0,
    vy: 0,
    speed: 8.5,
    jumpPower: -11.5,
    gravity: 0.55,
    grounded: false,
    facing: 'right',
    animFrame: 0,
    animTimer: 0,
    invincibleTimer: 0,

    reset(x, y) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.grounded = false;
        this.invincibleTimer = 60; 
    },

    update() {
        if (this.invincibleTimer > 0) this.invincibleTimer--;

        if (keys.left) {
            this.vx = -this.speed;
            this.facing = 'left';
        } else if (keys.right) {
            this.vx = this.speed;
            this.facing = 'right';
        } else {
            this.vx *= 0.7; 
        }

        if (keys.up && this.grounded) {
            this.vy = this.jumpPower;
            this.grounded = false;
        }

        this.vy += this.gravity;

        this.x += this.vx;
        if (this.x < 0) this.x = 0;

        this.y += this.vy;
        this.grounded = false;

        platforms.forEach(p => {
            if (this.x + this.w > p.x && 
                this.x < p.x + p.w && 
                this.y + this.h >= p.y && 
                this.y + this.h <= p.y + p.h + this.vy &&
                this.vy >= 0) {
                this.y = p.y - this.h;
                this.vy = 0;
                this.grounded = true;
            }
        });

        if (this.y > canvas.height + 100) {
            loseLife();
        }

        if (Math.abs(this.vx) > 0.2 && this.grounded) {
            this.animTimer++;
            if (this.animTimer % 12 === 0) {
                this.animFrame = (this.animFrame + 1) % 2;
            }
        } else {
            this.animFrame = 0;
        }
    },

    draw() {
        if (this.invincibleTimer % 10 > 5) return;

        ctx.save();
        ctx.translate(this.x - cameraX + this.w / 2, this.y + this.h / 2);
        if (this.facing === 'left') {
            ctx.scale(-1, 1);
        }

        const coatColor = '#d7be82'; 
        const darkMaskColor = '#2c2523'; 
        const detailColor = '#b59a5b'; 

        ctx.fillStyle = coatColor;
        ctx.beginPath();
        ctx.roundRect(-16, -8, 28, 18, 6);
        ctx.fill();

        ctx.fillStyle = detailColor;
        let legOffset = this.animFrame === 1 ? 3 : 0;
        ctx.fillRect(-12 + legOffset, 8, 6, 8);
        ctx.fillRect(4 - legOffset, 8, 6, 8);

        ctx.strokeStyle = detailColor;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(-16, -6, 4, 0, Math.PI * 1.5);
        ctx.stroke();

        ctx.fillStyle = coatColor;
        ctx.beginPath();
        ctx.moveTo(-1, -6); 
        ctx.quadraticCurveTo(0, -18, 8, -19); 
        ctx.quadraticCurveTo(16, -19, 18, -12); 
        ctx.quadraticCurveTo(19, -5, 15, -1); 
        ctx.quadraticCurveTo(8, 2, 0, -1); 
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = darkMaskColor;
        ctx.beginPath();
        ctx.roundRect(8, -7, 10, 10, 4);
        ctx.fill();

        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(16, -4, 1.8, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = darkMaskColor;
        ctx.beginPath();
        ctx.ellipse(3, -16, 4, 7, Math.PI / 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(11, -15, 3.5, 6, -Math.PI / 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(10, -11, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(11.5, -11, 2.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(12.5, -12, 1, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
};

// --- CHIHUAHUA ENEMY CLASS ---
class Chihuahua {
    constructor(x, y, patrolRange) {
        this.x = x;
        this.y = y;
        this.w = 30;
        this.h = 26;
        this.startX = x;
        this.patrolRange = patrolRange;
        this.vx = 1.3; 
        this.scared = false;
        this.vy = 0;
        this.barkTimer = Math.random() * 100;
        this.animFrame = 0;
        this.animTimer = 0;
    }

    update() {
        if (this.scared) {
            this.x += this.vx * 3;
            this.y += this.vy;
            this.vy += 0.2; 
            return;
        }

        this.x += this.vx;
        if (this.x > this.startX + this.patrolRange || this.x < this.startX) {
            this.vx *= -1; 
        }

        this.barkTimer++;

        this.animTimer++;
        if (this.animTimer % 8 === 0) {
            this.animFrame = (this.animFrame + 1) % 2;
        }
    }

    scareAway() {
        this.scared = true;
        this.vy = -5; 
        this.vx = player.facing === 'right' ? 3 : -3;
    }

    draw() {
        let rx = this.x - cameraX;
        let ry = this.y;

        ctx.save();
        ctx.translate(rx + this.w / 2, ry + this.h / 2);
        if (this.vx < 0 && !this.scared) {
            ctx.scale(-1, 1);
        }

        const tanColor = '#e0a96d';
        const blackCoat = '#252323';
        const innerEarColor = '#f3a6a6';

        ctx.fillStyle = tanColor;
        ctx.beginPath();
        ctx.roundRect(-12, -6, 22, 14, 4);
        ctx.fill();

        ctx.fillStyle = blackCoat;
        ctx.beginPath();
        ctx.roundRect(-12, -7, 18, 9, 3);
        ctx.fill();

        ctx.fillStyle = tanColor;
        let legOff = (!this.scared && this.animFrame === 1) ? 3 : 0;
        ctx.fillRect(-10 + legOff, 7, 4, 8);
        ctx.fillRect(4 - legOff, 7, 4, 8);

        ctx.strokeStyle = blackCoat;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-12, -4);
        ctx.lineTo(-17, -12);
        ctx.stroke();

        ctx.fillStyle = tanColor;
        ctx.beginPath();
        ctx.moveTo(0, -6);
        ctx.quadraticCurveTo(2, -18, 10, -18);
        ctx.quadraticCurveTo(16, -16, 17, -8);
        ctx.quadraticCurveTo(15, 0, 8, 0);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = blackCoat;
        ctx.beginPath();
        ctx.moveTo(1, -11);
        ctx.quadraticCurveTo(2, -18, 10, -18);
        ctx.quadraticCurveTo(15, -17, 15, -11);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = blackCoat;
        ctx.beginPath();
        ctx.moveTo(2, -14);
        ctx.lineTo(5, -26);
        ctx.lineTo(11, -15);
        ctx.fill();

        ctx.fillStyle = innerEarColor;
        ctx.beginPath();
        ctx.moveTo(4, -15);
        ctx.lineTo(6, -23);
        ctx.lineTo(9, -16);
        ctx.fill();

        ctx.fillStyle = tanColor;
        ctx.beginPath();
        ctx.roundRect(12, -8, 7, 5, 2);
        ctx.fill();

        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(18, -7, 1.2, 0, Math.PI * 2);
        ctx.fill();

        if (this.scared) {
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(10, -10, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(10, -10, 2, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(10, -10, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(10.5, -10, 1.8, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(11.2, -11, 0.7, 0, Math.PI * 2);
            ctx.fill();
        }

        if (!this.scared && Math.floor(this.barkTimer / 30) % 2 === 0) {
            ctx.fillStyle = '#f1c40f';
            ctx.font = 'bold 11px sans-serif';
            ctx.fillText('WOOF!', 8, -25);
        }

        ctx.restore();
    }
}

// --- ENHANCED PARALLAX SYSTEM ---
let bgLayers = [];
let stars = [];
let snowflakes = [];
let fireflies = [];
let clouds = [];

function initAtmosphere() {
    stars = [];
    for(let i=0; i<100; i++) {
        stars.push({
            x: Math.random() * levelWidth,
            y: Math.random() * canvas.height * 0.6,
            size: Math.random() * 2 + 0.5,
            twinkle: Math.random() * Math.PI * 2
        });
    }

    snowflakes = [];
    for(let i=0; i<150; i++) {
        snowflakes.push({
            x: Math.random() * levelWidth,
            y: Math.random() * canvas.height,
            speed: Math.random() * 1.5 + 0.5,
            size: Math.random() * 3 + 1,
            drift: Math.random() * 2 - 1
        });
    }

    fireflies = [];
    for(let i=0; i<40; i++) {
        fireflies.push({
            x: Math.random() * levelWidth,
            y: Math.random() * canvas.height * 0.8 + 50,
            phase: Math.random() * Math.PI * 2,
            speed: Math.random() * 0.5 + 0.2
        });
    }

    clouds = [];
    for(let i=0; i<8; i++) {
        clouds.push({
            x: Math.random() * levelWidth,
            y: Math.random() * canvas.height * 0.4 + 20,
            w: Math.random() * 100 + 60,
            h: Math.random() * 40 + 20,
            speed: Math.random() * 0.2 + 0.1
        });
    }
}

function generateLayers() {
    bgLayers = [];
    
    switch(currentTheme) {
        case 'SUNNY':
            bgLayers.push({ factor: 0.05, draw: drawDistantHillsLayer1 });
            bgLayers.push({ factor: 0.1, draw: drawDistantHillsLayer2 });
            bgLayers.push({ factor: 0.15, draw: drawDistantHillsLayer3 });
            bgLayers.push({ factor: 0.25, draw: drawForegroundHills });
            bgLayers.push({ factor: 0.4, draw: drawCloudsLayer });
            break;
        case 'JUNGLE':
            bgLayers.push({ factor: 0.05, draw: drawDistantMountainsLayer1 });
            bgLayers.push({ factor: 0.1, draw: drawDistantMountainsLayer2 });
            bgLayers.push({ factor: 0.2, draw: drawDistantMountainsLayer3 });
            bgLayers.push({ factor: 0.35, draw: drawCanopyLayer });
            bgLayers.push({ factor: 0.5, draw: drawFirefliesLayer });
            break;
        case 'WINTER':
            bgLayers.push({ factor: 0.05, draw: drawSnowyMountainsLayer1 });
            bgLayers.push({ factor: 0.1, draw: drawSnowyMountainsLayer2 });
            bgLayers.push({ factor: 0.15, draw: drawSnowyMountainsLayer3 });
            bgLayers.push({ factor: 0.25, draw: drawBareTreesLayer });
            bgLayers.push({ factor: 0.6, draw: drawSnowLayer });
            break;
        case 'CITY_NIGHT':
            bgLayers.push({ factor: 0.05, draw: drawSkylineLayer1 });
            bgLayers.push({ factor: 0.1, draw: drawSkylineLayer2 });
            bgLayers.push({ factor: 0.15, draw: drawSkylineLayer3 });
            bgLayers.push({ factor: 0.3, draw: drawLitWindowsLayer });
            bgLayers.push({ factor: 0.0, draw: drawStarsLayer });
            break;
        case 'CITY_DAY':
            bgLayers.push({ factor: 0.05, draw: drawSkylineDayLayer1 });
            bgLayers.push({ factor: 0.1, draw: drawSkylineDayLayer2 });
            bgLayers.push({ factor: 0.15, draw: drawSkylineDayLayer3 });
            bgLayers.push({ factor: 0.2, draw: drawStreetLevel });
            bgLayers.push({ factor: 0.4, draw: drawCloudsLayer });
            break;
    }
}

// --- THEME SPECIFIC LAYER DRAWING FUNCTIONS ---

function drawDistantHillsLayer1(offset) {
    ctx.fillStyle = '#a8e6cf';
    ctx.beginPath();
    ctx.moveTo(-50, canvas.height);
    for(let x = -50; x <= canvas.width + 50; x += 10) {
        let y = 300 + Math.sin((x + offset) / 300) * 40;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(canvas.width + 50, canvas.height);
    ctx.closePath();
    ctx.fill();
}

function drawDistantHillsLayer2(offset) {
    ctx.fillStyle = '#78e08f';
    ctx.beginPath();
    ctx.moveTo(-50, canvas.height);
    for(let x = -50; x <= canvas.width + 50; x += 10) {
        let y = 320 + Math.sin((x + offset) / 200) * 50;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(canvas.width + 50, canvas.height);
    ctx.closePath();
    ctx.fill();
}

function drawDistantHillsLayer3(offset) {
    ctx.fillStyle = '#38ada9';
    ctx.beginPath();
    ctx.moveTo(-50, canvas.height);
    for(let x = -50; x <= canvas.width + 50; x += 10) {
        let y = 340 + Math.sin((x + offset) / 150) * 60;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(canvas.width + 50, canvas.height);
    ctx.closePath();
    ctx.fill();
}

function drawForegroundHills(offset) {
    ctx.fillStyle = '#079992';
    ctx.beginPath();
    ctx.moveTo(-50, canvas.height);
    for(let x = -50; x <= canvas.width + 50; x += 10) {
        let y = 360 + Math.sin((x + offset) / 100) * 40;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(canvas.width + 50, canvas.height);
    ctx.closePath();
    ctx.fill();
}

function drawCloudsLayer(offset) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
    clouds.forEach(c => {
        let cx = (c.x - offset * 0.5) % (canvas.width + 200);
        if (cx < -100) cx += canvas.width + 200;
        ctx.beginPath();
        ctx.arc(cx, c.y, c.h, 0, Math.PI * 2);
        ctx.arc(cx + c.w * 0.3, c.y - c.h * 0.2, c.h * 0.8, 0, Math.PI * 2);
        ctx.arc(cx + c.w * 0.6, c.y, c.h * 0.9, 0, Math.PI * 2);
        ctx.fill();
    });
}

function drawDistantMountainsLayer1(offset) {
    ctx.fillStyle = '#1e3c72';
    ctx.beginPath();
    ctx.moveTo(-50, canvas.height);
    for(let x = -50; x <= canvas.width + 50; x += 10) {
        let y = 250 + Math.sin((x + offset) / 400) * 80;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(canvas.width + 50, canvas.height);
    ctx.closePath();
    ctx.fill();
}

function drawDistantMountainsLayer2(offset) {
    ctx.fillStyle = '#2a5298';
    ctx.beginPath();
    ctx.moveTo(-50, canvas.height);
    for(let x = -50; x <= canvas.width + 50; x += 10) {
        let y = 280 + Math.sin((x + offset) / 300) * 70;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(canvas.width + 50, canvas.height);
    ctx.closePath();
    ctx.fill();
}

function drawDistantMountainsLayer3(offset) {
    ctx.fillStyle = '#3b1c5b';
    ctx.beginPath();
    ctx.moveTo(-50, canvas.height);
    for(let x = -50; x <= canvas.width + 50; x += 10) {
        let y = 300 + Math.sin((x + offset) / 200) * 60;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(canvas.width + 50, canvas.height);
    ctx.closePath();
    ctx.fill();
}

function drawCanopyLayer(offset) {
    ctx.fillStyle = '#0b382d';
    for(let x = -200; x < canvas.width + 200; x += 150) {
        let rx = x - (offset * 0.35);
        ctx.beginPath();
        ctx.arc(rx, 280, 80, 0, Math.PI * 2);
        ctx.arc(rx + 60, 260, 90, 0, Math.PI * 2);
        ctx.arc(rx + 120, 280, 70, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawFirefliesLayer(offset) {
    ctx.fillStyle = '#f1c40f';
    let time = Date.now() * 0.001;
    fireflies.forEach(f => {
        let fx = (f.x - offset * 0.5) % (canvas.width + 200);
        if (fx < -100) fx += canvas.width + 200;
        let fy = f.y + Math.sin(time * f.speed + f.phase) * 10;
        ctx.globalAlpha = 0.6 + Math.sin(time * 2 + f.phase) * 0.4;
        ctx.beginPath();
        ctx.arc(fx, fy, 2, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1.0;
}

function drawSnowyMountainsLayer1(offset) {
    ctx.fillStyle = '#7f8c8d';
    ctx.beginPath();
    ctx.moveTo(-50, canvas.height);
    for(let x = -50; x <= canvas.width + 50; x += 10) {
        let y = 200 + Math.sin((x + offset) / 500) * 100;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(canvas.width + 50, canvas.height);
    ctx.closePath();
    ctx.fill();
}

function drawSnowyMountainsLayer2(offset) {
    ctx.fillStyle = '#bdc3c7';
    ctx.beginPath();
    ctx.moveTo(-50, canvas.height);
    for(let x = -50; x <= canvas.width + 50; x += 10) {
        let y = 250 + Math.sin((x + offset) / 400) * 90;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(canvas.width + 50, canvas.height);
    ctx.closePath();
    ctx.fill();
}

function drawSnowyMountainsLayer3(offset) {
    ctx.fillStyle = '#ecf0f1';
    ctx.beginPath();
    ctx.moveTo(-50, canvas.height);
    for(let x = -50; x <= canvas.width + 50; x += 10) {
        let y = 300 + Math.sin((x + offset) / 300) * 80;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(canvas.width + 50, canvas.height);
    ctx.closePath();
    ctx.fill();
}

function drawBareTreesLayer(offset) {
    ctx.fillStyle = '#2c3e50';
    for(let x = -100; x < canvas.width + 100; x += 120) {
        let rx = x - (offset * 0.25);
        ctx.fillRect(rx, 250, 10, 100);
        ctx.beginPath();
        ctx.moveTo(rx + 5, 280);
        ctx.lineTo(rx - 15, 300);
        ctx.lineTo(rx + 5, 290);
        ctx.lineTo(rx + 25, 310);
        ctx.lineTo(rx + 5, 300);
        ctx.fill();
    }
}

function drawSnowLayer(offset) {
    ctx.fillStyle = '#fff';
    snowflakes.forEach(s => {
        let sx = (s.x - offset * 0.6) % (canvas.width + 100);
        if (sx < -50) sx += canvas.width + 100;
        let sy = (s.y + s.speed) % canvas.height;
        let drift = Math.sin(Date.now() * 0.001 + s.x) * s.drift;
        ctx.beginPath();
        ctx.arc(sx + drift, sy, s.size, 0, Math.PI * 2);
        ctx.fill();
    });
}

function drawSkylineLayer1(offset) {
    ctx.fillStyle = '#0f2027';
    ctx.beginPath();
    ctx.moveTo(-50, canvas.height);
    for(let x = -50; x <= canvas.width + 50; x += 10) {
        let y = 350 + Math.sin((x + offset) / 200) * 50;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(canvas.width + 50, canvas.height);
    ctx.closePath();
    ctx.fill();
}

function drawSkylineLayer2(offset) {
    ctx.fillStyle = '#203a43';
    ctx.beginPath();
    ctx.moveTo(-50, canvas.height);
    for(let x = -50; x <= canvas.width + 50; x += 10) {
        let y = 360 + Math.sin((x + offset) / 150) * 40;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(canvas.width + 50, canvas.height);
    ctx.closePath();
    ctx.fill();
}

function drawSkylineLayer3(offset) {
    ctx.fillStyle = '#2c3e50';
    ctx.beginPath();
    ctx.moveTo(-50, canvas.height);
    for(let x = -50; x <= canvas.width + 50; x += 10) {
        let y = 370 + Math.sin((x + offset) / 100) * 30;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(canvas.width + 50, canvas.height);
    ctx.closePath();
    ctx.fill();
}

function drawLitWindowsLayer(offset) {
    ctx.fillStyle = '#f1c40f';
    let time = Date.now() * 0.001;
    for(let x = -100; x < canvas.width + 100; x += 60) {
        let rx = x - (offset * 0.3);
        let seed = Math.abs(Math.sin(x * 12.9898) * 43758.5453);
        let seed2 = Math.abs(Math.cos(x * 78.233) * 23421.631);
        for(let wy = 300; wy < canvas.height - 50; wy += 25) {
            if (Math.floor(seed + wy * 0.1) % 3 !== 0) {
                let flicker = Math.sin(time * 2 + wy + x) > 0.8 ? 1 : 0.3;
                ctx.globalAlpha = flicker;
                ctx.fillRect(rx + 10, wy, 8, 12);
            }
        }
    }
    ctx.globalAlpha = 1.0;
}

function drawStarsLayer(offset) {
    ctx.fillStyle = '#fff';
    let time = Date.now() * 0.001;
    stars.forEach(s => {
        let sx = (s.x - offset * 0.02) % (canvas.width + 100);
        if (sx < -50) sx += canvas.width + 100;
        let twinkle = 0.5 + Math.sin(time * 3 + s.twinkle) * 0.5;
        ctx.globalAlpha = twinkle;
        ctx.beginPath();
        ctx.arc(sx, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1.0;
}

function drawSkylineDayLayer1(offset) {
    ctx.fillStyle = '#3498db';
    ctx.beginPath();
    ctx.moveTo(-50, canvas.height);
    for(let x = -50; x <= canvas.width + 50; x += 10) {
        let y = 350 + Math.sin((x + offset) / 200) * 50;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(canvas.width + 50, canvas.height);
    ctx.closePath();

}

function drawSkylineDayLayer2(offset) {

    for(let x = -50; x <= canvas.width + 50; x += 10) {

    }

}

        ctx.lineTo(x, y);
    }

}

function drawStreetLevel(offset) {
    ctx.fillStyle = '#7f8c8d';
    ctx.fillRect(-50, canvas.height - 20, canvas.width + 100, 20);
    ctx.fillStyle = '#95a5a6';
    ctx.fillRect(-50, canvas.height - 25, canvas.width + 100, 5);
}

// --- MAIN BACKGROUND DRAWING ---
function drawParallaxBackground() {
    let bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    
    switch (currentTheme) {
        case 'SUNNY':
            bgGradient.addColorStop(0, '#70c5ce');
            bgGradient.addColorStop(1, '#cce8e4');
            ctx.fillStyle = bgGradient; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(650, 80, 40, 0, Math.PI * 2); ctx.fill();
            break;
        case 'JUNGLE':
            bgGradient.addColorStop(0, '#134e5e');
            bgGradient.addColorStop(1, '#71b280');
            ctx.fillStyle = bgGradient; ctx.fillRect(0, 0, canvas.width, canvas.height);
            break;
        case 'WINTER':
            bgGradient.addColorStop(0, '#1c2833');
            bgGradient.addColorStop(1, '#4a6572');
            ctx.fillStyle = bgGradient; ctx.fillRect(0, 0, canvas.width, canvas.height);
            break;
        case 'CITY_NIGHT':
            bgGradient.addColorStop(0, '#0f2027');
            bgGradient.addColorStop(1, '#203a43');
            ctx.fillStyle = bgGradient; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#f5f6fa'; ctx.beginPath(); ctx.arc(150, 70, 30, 0, Math.PI * 2); ctx.fill();
            break;
        case 'CITY_DAY':
            bgGradient.addColorStop(0, '#f39c12');
            bgGradient.addColorStop(1, '#f1c40f');
            ctx.fillStyle = bgGradient; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(100, 80, 45, 0, Math.PI * 2); ctx.fill();
            break;
    }

    bgLayers.forEach(layer => {
        layer.draw(cameraX * layer.factor);
    });
}

// --- LEVEL GENERATION & RANDOMIZATION ---
function populateLevelObjects() {
    treats = [];
    enemies = [];
    heartPickup = null;
    let validEnemyPlatforms = [];
    let validHeartPlatforms = [];

    platforms.forEach(plat => {
        if (plat.y === 380 && plat.x > 400 && plat.x < levelWidth - 400) {
            validEnemyPlatforms.push(plat);
        }
        if (plat.h === 70) {
            for (let t = plat.x + 60; t < plat.x + plat.w - 30; t += 90) {
                if (Math.random() > 0.4) {
                    treats.push({ x: t, y: 340, collected: false, floatOffset: Math.random() * 10 });
                }
            }
        } else {
            validHeartPlatforms.push(plat);
            if (plat.y === 280) {
                treats.push({ x: plat.x + plat.w / 2, y: plat.y - 35, collected: false, floatOffset: Math.random() * 10 });
            } else if (plat.y === 180) {
                treats.push({ x: plat.x + 20, y: plat.y - 35, collected: false, floatOffset: Math.random() * 10 });
                treats.push({ x: plat.x + plat.w - 20, y: plat.y - 35, collected: false, floatOffset: Math.random() * 10 });
            }
        }
    });

    if (validHeartPlatforms.length > 0) {
        let heartPlat = validHeartPlatforms[Math.floor(Math.random() * validHeartPlatforms.length)];
        heartPickup = {
            x: heartPlat.x + heartPlat.w / 2,
            y: heartPlat.y - 35,
            collected: false,
            floatOffset: Math.random() * 10
        };
    }

    let numEnemies = Math.floor(Math.random() * 3) + 1; 
    for (let i = 0; i < numEnemies; i++) {
        if (validEnemyPlatforms.length > 0) {
            let idx = Math.floor(Math.random() * validEnemyPlatforms.length);
            let targetPlat = validEnemyPlatforms.splice(idx, 1)[0];
            enemies.push(new Chihuahua(targetPlat.x + 30, targetPlat.y - 26, targetPlat.w - 60));
        }
    }
}

function generateLevel() {
    platforms = [];
    currentTheme = THEMES[Math.floor(Math.random() * THEMES.length)];
    generateLayers();
    initAtmosphere();

    let x = 0;
    while (x < levelWidth) {
        let pWidth = 200 + Math.random() * 200; 
        if (x === 0) pWidth = 450; 
        
        let plat = { x: x, y: 380, w: pWidth, h: 70 };
        platforms.push(plat);

        if (x > 250 && x < levelWidth - 400) {
            let midY = 280;
            let midW = 100 + Math.random() * 80;
            let midX = x + 30;
            platforms.push({ x: midX, y: midY, w: midW, h: 20 });

            if (Math.random() > 0.4) {
                let highY = 180;
                let highW = 90 + Math.random() * 60;
                let highX = midX + 40;
                platforms.push({ x: highX, y: highY, w: highW, h: 20 });
            }
        }

        x += pWidth + (80 + Math.random() * 50); 
    }

    finishLine = { x: levelWidth - 200, y: 300, w: 60, h: 80 };
    platforms.push({ x: levelWidth - 300, y: 380, w: 300, h: 70 });

    populateLevelObjects();
    player.reset(100, 200);
}

function loseLife() {
    playerLives--;
    totalTreats = levelStartTreats;
    updateHUD();

    if (playerLives <= 0) {
        showGameOver();
    } else {
        populateLevelObjects();
        player.reset(100, 200);
    }
}

function updateHUD() {
    document.getElementById('treat-count').innerText = `🦴 Treats: ${totalTreats}`;
    document.getElementById('lives-display').innerText = `❤️ Lives: ${playerLives}`;
    document.getElementById('level-display').innerText = `Level ${currentLevel}`;
}

// --- RENDERING & COLLISIONS ---
function drawPlatforms() {
    platforms.forEach(p => {
        let rx = p.x - cameraX;
        switch (currentTheme) {
            case 'SUNNY': ctx.fillStyle = '#5cd38c'; ctx.fillRect(rx, p.y, p.w, 12); ctx.fillStyle = '#8d5524'; ctx.fillRect(rx, p.y + 12, p.w, p.h - 12); break;
            case 'JUNGLE': ctx.fillStyle = '#27ae60'; ctx.fillRect(rx, p.y, p.w, 15); ctx.fillStyle = '#2c3e50'; ctx.fillRect(rx, p.y + 15, p.w, p.h - 15); break;
            case 'WINTER': ctx.fillStyle = '#ecf0f1'; ctx.fillRect(rx, p.y, p.w, 14); ctx.fillStyle = '#34495e'; ctx.fillRect(rx, p.y + 14, p.w, p.h - 14); break;
            case 'CITY_NIGHT': case 'CITY_DAY': ctx.fillStyle = '#7f8c8d'; ctx.fillRect(rx, p.y, p.w, p.h); ctx.fillStyle = '#95a5a6'; ctx.fillRect(rx, p.y, p.w, 6); break;
        }
    });
}

function drawTreats() {
    let time = Date.now() * 0.003;
    treats.forEach(t => {
        if (t.collected) return;
        let rx = t.x - cameraX;
        let ry = t.y + Math.sin(time + t.floatOffset) * 4;
        ctx.fillStyle = '#f39c12';
        ctx.beginPath(); ctx.roundRect(rx - 10, ry - 4, 20, 8, 3); ctx.fill();
        ctx.beginPath(); ctx.arc(rx - 10, ry - 4, 5, 0, Math.PI * 2); ctx.arc(rx - 10, ry + 4, 5, 0, Math.PI * 2); ctx.arc(rx + 10, ry - 4, 5, 0, Math.PI * 2); ctx.arc(rx + 10, ry + 4, 5, 0, Math.PI * 2); ctx.fill();
        if (player.x < t.x + 15 && player.x + player.w > t.x - 15 && player.y < ry + 15 && player.y + player.h > ry - 15) {
            t.collected = true; totalTreats++; updateHUD();
        }
    });
}

function drawHeartPickup() {
    if (!heartPickup || heartPickup.collected) return;

    let time = Date.now() * 0.004;
    let rx = heartPickup.x - cameraX;
    let ry = heartPickup.y + Math.sin(time + heartPickup.floatOffset) * 5;

    ctx.save();
    ctx.translate(rx, ry);

    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.arc(-5, -4, 6, Math.PI, 0);
    ctx.arc(5, -4, 6, Math.PI, 0);
    ctx.lineTo(0, 8);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-4, -5, 1.8, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    if (player.x < heartPickup.x + 18 && player.x + player.w > heartPickup.x - 18 &&
        player.y < ry + 18 && player.y + player.h > ry - 18) {
        
        heartPickup.collected = true;
        if (playerLives < maxLives) {
            playerLives++;
        }
        totalTreats += 10; 
        updateHUD();
    }
}

function handleEnemies() {
    enemies.forEach(e => {
        e.update();
        e.draw();
        if (e.scared) return;
        if (player.x < e.x + e.w && player.x + player.w > e.x && player.y < e.y + e.h && player.y + player.h > e.y) {
            
            if (player.vy > 0 && player.y + player.h - player.vy <= e.y + 8) {
                e.scareAway();
                player.vy = player.jumpPower * 0.8; 
                totalTreats += 5; 
                updateHUD();
            } else if (player.invincibleTimer <= 0) {
                totalTreats = levelStartTreats;
                player.invincibleTimer = 60; 
                updateHUD();
            }
        }
    });
}

function drawFinishLine() {
    let rx = finishLine.x - cameraX;
    ctx.fillStyle = '#e74c2c'; ctx.fillRect(rx, finishLine.y, finishLine.w, finishLine.h);
    ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.moveTo(rx - 10, finishLine.y); ctx.lineTo(rx + finishLine.w / 2, finishLine.y - 30); ctx.lineTo(rx + finishLine.w + 10, finishLine.y); ctx.fill();
    ctx.fillStyle = '#2c3e50'; ctx.beginPath(); ctx.arc(rx + finishLine.w / 2, finishLine.y + finishLine.h, 18, Math.PI, 0); ctx.fill();
    if (player.x + player.w > finishLine.x && player.x < finishLine.x + finishLine.w) {
        showLevelClear();
    }
}

// --- FIXED TIMESTEP GAME LOOP ---
let lastTime = performance.now();
let accumulator = 0;
const physicsStep = 1000 / 60;

function updateGameLogic() {
    if (gameState === 'PLAYING') {
        player.update();
        
        cameraX = player.x - 200;
        if (cameraX < 0) cameraX = 0;
        if (cameraX > levelWidth - canvas.width) cameraX = levelWidth - canvas.width;
    }
}

function renderGame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    drawParallaxBackground();
    drawPlatforms();
    drawTreats();
    drawHeartPickup();
    handleEnemies();
    drawFinishLine();
    player.draw();
}

function gameLoop(now) {
    let dt = now - lastTime;
    lastTime = now;

    if (dt > 250) dt = 250;

    accumulator += dt;

    while (accumulator >= physicsStep) {
        updateGameLogic();
        accumulator -= physicsStep;
    }

    renderGame();
    requestAnimationFrame(gameLoop);
}

// --- STATE MANAGEMENT ---
function startGame() {
    totalTreats = 0; 
    levelStartTreats = 0;
    playerLives = 5; 
    currentLevel = 1; 
    updateHUD();
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('end-screen').classList.add('hidden');
    loadLevel(currentLevel);
    gameState = 'PLAYING';
}

function loadLevel(lvl) {
    levelStartTreats = totalTreats; 
    updateHUD();
    generateLevel();
}

function showLevelClear() {
    gameState = 'LEVEL_CLEAR';
    document.getElementById('level-title').innerText = `Level ${currentLevel} Complete!`;
    document.getElementById('level-desc').innerText = `You've collected ${totalTreats} treats! Ready for the next world?`;
    document.getElementById('level-screen').classList.remove('hidden');
}

function nextLevel() {
    currentLevel++;
    document.getElementById('level-screen').classList.add('hidden');
    loadLevel(currentLevel);
    gameState = 'PLAYING';
}

function showGameOver() {
    gameState = 'GAME_OVER';
    document.getElementById('end-desc').innerText = `You ran out of lives! Total treats banked: ${totalTreats}`;
    document.getElementById('end-screen').classList.remove('hidden');
}

function restartGame() {
    startGame();
}

// Start Game Loop
requestAnimationFrame(gameLoop);

</script>
