<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pug Run: Treat Collector</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 450px;
            border: 4px solid #fff;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            text-align: center;
            padding: 20px;
        }

        .overlay h1 {
            font-size: 42px;
            color: #f1c40f;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0 #000;
        }

        .overlay p {
            font-size: 18px;
            margin-bottom: 20px;
            max-width: 500px;
            line-height: 1.4;
        }

        .btn {
            background: #2ecc71;
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 0 #27ae60;
            transition: all 0.1s ease;
        }

        .btn:hover {
            background: #27ae60;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1e8449;
        }

        .hidden {
            display: none !important;
        }

        .controls-hint {
            margin-top: 15px;
            font-size: 14px;
            color: #ccc;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <div id="ui-layer">
        <div class="hud">
            <div id="treat-count">🦴 Treats: 0</div>
            <div id="lives-display">❤️ Lives: 5</div>
            <div id="level-display">Level 1/10</div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay">
        <h1>Pug Run!</h1>
        <p>Help the little pug collect treats and scare away feisty Chihuahuas by jumping on them across 10 levels!</p>
        <button class="btn" onclick="startGame()">Start Game</button>
        <div class="controls-hint">Controls: Arrow Keys / WASD to move & jump</div>
    </div>

    <!-- Level Complete Screen -->
    <div id="level-screen" class="overlay hidden">
        <h1 id="level-title">Level Cleared!</h1>
        <p id="level-desc">Great job! Get ready for the next area.</p>
        <button class="btn" onclick="nextLevel()">Next Level</button>
    </div>

    <!-- Game Over / Win Screen -->
    <div id="end-screen" class="overlay hidden">
        <h1 id="end-title">Game Over!</h1>
        <p id="end-desc">You ran out of lives!</p>
        <button class="btn" onclick="restartGame()">Play Again</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- GAME STATE ---
let gameState = 'START'; 
let currentLevel = 1;
const maxLevels = 10;
let totalTreats = 0;
let playerLives = 5;
let cameraX = 0;
const levelWidth = 3200;

// Keys State
const keys = {
    left: false,
    right: false,
    up: false
};

// Listeners
window.addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
    if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.up = true;
});

window.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.up = false;
});

// --- THEME DEFINITIONS ---
const THEMES = ['SUNNY', 'JUNGLE', 'WINTER', 'CITY_NIGHT', 'CITY_DAY'];

let currentTheme = 'SUNNY';
let platforms = [];
let treats = [];
let enemies = [];
let finishLine = { x: 0, y: 0, w: 40, h: 80 };

// --- PLAYER (PUG) ---
const player = {
    x: 100,
    y: 200,
    w: 36,
    h: 30,
    vx: 0,
    vy: 0,
    speed: 3.0,          // Balanced speed
    jumpPower: -8.8,     // tuned jump height for clear arc
    gravity: 0.32,       // tuned floaty gravity
    grounded: false,
    facing: 'right',
    animFrame: 0,
    animTimer: 0,
    invincibleTimer: 0,

    reset(x, y) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.grounded = false;
        this.invincibleTimer = 60; 
    },

    update() {
        if (this.invincibleTimer > 0) this.invincibleTimer--;

        // Movement
        if (keys.left) {
            this.vx = -this.speed;
            this.facing = 'left';
        } else if (keys.right) {
            this.vx = this.speed;
            this.facing = 'right';
        } else {
            this.vx *= 0.7; // friction
        }

        if (keys.up && this.grounded) {
            this.vy = this.jumpPower;
            this.grounded = false;
        }

        // Apply Gravity
        this.vy += this.gravity;

        // X Position & Collision
        this.x += this.vx;
        if (this.x < 0) this.x = 0;

        // Y Position & Collision
        this.y += this.vy;
        this.grounded = false;

        // Platform Collisions
        platforms.forEach(p => {
            if (this.x + this.w > p.x && 
                this.x < p.x + p.w && 
                this.y + this.h >= p.y && 
                this.y + this.h <= p.y + p.h + this.vy &&
                this.vy >= 0) {
                this.y = p.y - this.h;
                this.vy = 0;
                this.grounded = true;
            }
        });

        // Bottom Boundary
        if (this.y > canvas.height + 100) {
            loseLife();
        }

        // Animation timing
        if (Math.abs(this.vx) > 0.2 && this.grounded) {
            this.animTimer++;
            if (this.animTimer % 12 === 0) {
                this.animFrame = (this.animFrame + 1) % 2;
            }
        } else {
            this.animFrame = 0;
        }
    },

    draw() {
        if (this.invincibleTimer % 10 > 5) return;

        ctx.save();
        ctx.translate(this.x - cameraX + this.w / 2, this.y + this.h / 2);
        if (this.facing === 'left') {
            ctx.scale(-1, 1);
        }

        const coatColor = '#d7be82'; 
        const darkMaskColor = '#2c2523'; 
        const detailColor = '#b59a5b'; 

        // 1. Body
        ctx.fillStyle = coatColor;
        ctx.beginPath();
        ctx.roundRect(-16, -8, 28, 18, 6);
        ctx.fill();

        // 2. Legs
        ctx.fillStyle = detailColor;
        let legOffset = this.animFrame === 1 ? 3 : 0;
        ctx.fillRect(-12 + legOffset, 8, 6, 8);
        ctx.fillRect(4 - legOffset, 8, 6, 8);

        // 3. Curly Tail
        ctx.strokeStyle = detailColor;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(-16, -6, 4, 0, Math.PI * 1.5);
        ctx.stroke();

        // 4. Integrated Head
        ctx.fillStyle = coatColor;
        ctx.beginPath();
        ctx.moveTo(-1, -6); 
        ctx.quadraticCurveTo(0, -18, 8, -19); 
        ctx.quadraticCurveTo(16, -19, 18, -12); 
        ctx.quadraticCurveTo(19, -5, 15, -1); 
        ctx.quadraticCurveTo(8, 2, 0, -1); 
        ctx.closePath();
        ctx.fill();

        // 5. Black Muzzle
        ctx.fillStyle = darkMaskColor;
        ctx.beginPath();
        ctx.roundRect(8, -7, 10, 10, 4);
        ctx.fill();

        // 6. Nose
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(16, -4, 1.8, 0, Math.PI * 2);
        ctx.fill();

        // 7. Ears
        ctx.fillStyle = darkMaskColor;
        ctx.beginPath();
        ctx.ellipse(3, -16, 4, 7, Math.PI / 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(11, -15, 3.5, 6, -Math.PI / 10, 0, Math.PI * 2);
        ctx.fill();

        // 8. Eyes
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(10, -11, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(11.5, -11, 2.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(12.5, -12, 1, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
};

// --- CHIHUAHUA ENEMY CLASS ---
class Chihuahua {
    constructor(x, y, patrolRange) {
        this.x = x;
        this.y = y;
        this.w = 28;
        this.h = 24;
        this.startX = x;
        this.patrolRange = patrolRange;
        this.vx = 1.0; 
        this.scared = false;
        this.vy = 0;
        this.barkTimer = Math.random() * 100;
    }

    update() {
        if (this.scared) {
            this.x += this.vx * 3;
            this.y += this.vy;
            this.vy += 0.2; 
            return;
        }

        this.x += this.vx;
        if (this.x > this.startX + this.patrolRange || this.x < this.startX) {
            this.vx *= -1; 
        }

        this.barkTimer++;
    }

    scareAway() {
        this.scared = true;
        this.vy = -5; 
        this.vx = player.facing === 'right' ? 3 : -3;
    }

    draw() {
        let rx = this.x - cameraX;
        let ry = this.y;

        ctx.save();
        ctx.translate(rx + this.w / 2, ry + this.h / 2);
        if (this.vx < 0 && !this.scared) {
            ctx.scale(-1, 1);
        }

        ctx.fillStyle = '#e0a96d';
        ctx.beginPath();
        ctx.roundRect(-12, -6, 22, 14, 4);
        ctx.fill();

        ctx.fillRect(-10, 8, 4, 6);
        ctx.fillRect(4, 8, 4, 6);

        ctx.beginPath();
        ctx.arc(8, -8, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(4, -14);
        ctx.lineTo(8, -24);
        ctx.lineTo(12, -14);
        ctx.fill();

        ctx.beginPath();
        ctx.roundRect(12, -8, 6, 5, 2);
        ctx.fill();

        ctx.fillStyle = this.scared ? '#e74c3c' : '#000';
        ctx.beginPath();
        ctx.arc(10, -10, 2, 0, Math.PI * 2);
        ctx.fill();

        if (!this.scared && Math.floor(this.barkTimer / 30) % 2 === 0) {
            ctx.fillStyle = '#f1c40f';
            ctx.font = 'bold 10px sans-serif';
            ctx.fillText('WOOF!', 10, -22);
        }

        ctx.restore();
    }
}

// --- LEVEL GENERATION ---
function generateLevel() {
    platforms = [];
    treats = [];
    enemies = [];
    currentTheme = THEMES[Math.floor(Math.random() * THEMES.length)];
    let validEnemyPlatforms = [];

    // Base Floor platforms with SAFE gap width logic
    let x = 0;
    while (x < levelWidth) {
        let pWidth = 350 + Math.random() * 250;
        if (x === 0) pWidth = 500; 
        
        let plat = { x: x, y: 380, w: pWidth, h: 70 };
        platforms.push(plat);

        if (x > 500 && x < levelWidth - 500) {
            validEnemyPlatforms.push(plat);
        }

        // Spawn treats on main floor
        for (let t = x + 80; t < x + pWidth - 40; t += 100) {
            if (Math.random() > 0.3) {
                treats.push({ x: t, y: 340, collected: false, floatOffset: Math.random() * 10 });
            }
        }

        // Floating platforms (Easier to reach)
        if (x > 300 && x < levelWidth - 400) {
            let platY = 270 + (Math.random() * 30 - 15); // Lowered so jumps reach cleanly
            let platW = 140 + Math.random() * 80;
            platforms.push({
                x: x + 80,
                y: platY,
                w: platW,
                h: 20
            });
            treats.push({ x: x + 80 + platW/2, y: platY - 35, collected: false, floatOffset: Math.random() * 10 });
        }

        // Gap strictly capped between 70px and 110px (Very easily jumpable)
        x += pWidth + (70 + Math.random() * 40); 
    }

    // Spawn Enemies
    let numEnemies = Math.floor(Math.random() * 3) + 1; 
    for (let i = 0; i < numEnemies; i++) {
        if (validEnemyPlatforms.length > 0) {
            let idx = Math.floor(Math.random() * validEnemyPlatforms.length);
            let targetPlat = validEnemyPlatforms.splice(idx, 1)[0];
            enemies.push(new Chihuahua(targetPlat.x + 50, targetPlat.y - 24, targetPlat.w - 100));
        }
    }

    // Finish Goal
    finishLine = { x: levelWidth - 200, y: 300, w: 60, h: 80 };
    platforms.push({ x: levelWidth - 300, y: 380, w: 300, h: 70 });

    player.reset(100, 200);
}

function loseLife() {
    playerLives--;
    updateHUD();
    if (playerLives <= 0) {
        showGameOver();
    } else {
        player.reset(100, 200);
    }
}

function updateHUD() {
    document.getElementById('treat-count').innerText = `🦴 Treats: ${totalTreats}`;
    document.getElementById('lives-display').innerText = `❤️ Lives: ${playerLives}`;
    document.getElementById('level-display').innerText = `Level ${currentLevel}/${maxLevels}`;
}

// --- BACKGROUND DRAWING ---
function drawParallaxBackground() {
    let bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    
    switch (currentTheme) {
        case 'SUNNY':
            bgGradient.addColorStop(0, '#70c5ce');
            bgGradient.addColorStop(1, '#cce8e4');
            ctx.fillStyle = bgGradient; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff7b1'; ctx.beginPath(); ctx.arc(650, 80, 40, 0, Math.PI * 2); ctx.fill();
            drawClouds(0.1, '#ffffff');
            break;
        case 'JUNGLE':
            bgGradient.addColorStop(0, '#134e5e');
            bgGradient.addColorStop(1, '#71b280');
            ctx.fillStyle = bgGradient; ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawDistantMountains(0.2, '#195b4e');
            break;
        case 'WINTER':
            bgGradient.addColorStop(0, '#2c3e50');
            bgGradient.addColorStop(1, '#000000');
            ctx.fillStyle = bgGradient; ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawDistantMountains(0.15, '#7f8c8d');
            drawClouds(0.2, 'rgba(255, 255, 255, 0.6)');
            break;
        case 'CITY_NIGHT':
            bgGradient.addColorStop(0, '#0f2027');
            bgGradient.addColorStop(1, '#203a43');
            ctx.fillStyle = bgGradient; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#f5f6fa'; ctx.beginPath(); ctx.arc(150, 70, 30, 0, Math.PI * 2); ctx.fill();
            drawSkyline(0.2, '#111923', true);
            break;
        case 'CITY_DAY':
            bgGradient.addColorStop(0, '#f39c12');
            bgGradient.addColorStop(1, '#f1c40f');
            ctx.fillStyle = bgGradient; ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawSkyline(0.2, '#d35400', false);
            break;
    }
}

function drawClouds(factor, color) {
    ctx.fillStyle = color;
    let offset = (cameraX * factor) % 800;
    for (let i = -100; i < canvas.width + 200; i += 300) {
        let x = i - offset;
        ctx.beginPath();
        ctx.arc(x, 100, 25, 0, Math.PI * 2); ctx.arc(x + 25, 90, 35, 0, Math.PI * 2); ctx.arc(x + 55, 100, 25, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawDistantMountains(factor, color) {
    ctx.fillStyle = color;
    let offset = (cameraX * factor) % 400;
    ctx.beginPath(); ctx.moveTo(0, canvas.height);
    for (let x = -100; x < canvas.width + 200; x += 200) {
        let rx = x - offset; ctx.lineTo(rx + 100, 180); ctx.lineTo(rx + 200, canvas.height);
    }
    ctx.fill();
}

function drawSkyline(factor, color, showLights) {
    ctx.fillStyle = color;
    let offset = (cameraX * factor) % 600;
    for (let x = -100; x < canvas.width + 200; x += 80) {
        let rx = x - offset;
        let h = 150 + (Math.sin(x) * 80);
        ctx.fillRect(rx, canvas.height - h, 65, h);
        if (showLights) {
            ctx.fillStyle = '#f1c40f';
            for (let wy = canvas.height - h + 10; wy < canvas.height - 20; wy += 20) {
                for (let wx = rx + 8; wx < rx + 50; wx += 15) {
                    if (Math.random() > 0.3) ctx.fillRect(wx, wy, 8, 10);
                }
            }
            ctx.fillStyle = color;
        }
    }
}

// --- RENDERING & COLLISIONS ---
function drawPlatforms() {
    platforms.forEach(p => {
        let rx = p.x - cameraX;
        switch (currentTheme) {
            case 'SUNNY': ctx.fillStyle = '#5cd38c'; ctx.fillRect(rx, p.y, p.w, 12); ctx.fillStyle = '#8d5524'; ctx.fillRect(rx, p.y + 12, p.w, p.h - 12); break;
            case 'JUNGLE': ctx.fillStyle = '#27ae60'; ctx.fillRect(rx, p.y, p.w, 15); ctx.fillStyle = '#2c3e50'; ctx.fillRect(rx, p.y + 15, p.w, p.h - 15); break;
            case 'WINTER': ctx.fillStyle = '#ecf0f1'; ctx.fillRect(rx, p.y, p.w, 14); ctx.fillStyle = '#34495e'; ctx.fillRect(rx, p.y + 14, p.w, p.h - 14); break;
            case 'CITY_NIGHT': case 'CITY_DAY': ctx.fillStyle = '#7f8c8d'; ctx.fillRect(rx, p.y, p.w, p.h); ctx.fillStyle = '#95a5a6'; ctx.fillRect(rx, p.y, p.w, 6); break;
        }
    });
}

function drawTreats() {
    let time = Date.now() * 0.003;
    treats.forEach(t => {
        if (t.collected) return;
        let rx = t.x - cameraX;
        let ry = t.y + Math.sin(time + t.floatOffset) * 4;
        ctx.fillStyle = '#f39c12';
        ctx.beginPath(); ctx.roundRect(rx - 10, ry - 4, 20, 8, 3); ctx.fill();
        ctx.beginPath(); ctx.arc(rx - 10, ry - 4, 5, 0, Math.PI * 2); ctx.arc(rx - 10, ry + 4, 5, 0, Math.PI * 2); ctx.arc(rx + 10, ry - 4, 5, 0, Math.PI * 2); ctx.arc(rx + 10, ry + 4, 5, 0, Math.PI * 2); ctx.fill();
        if (player.x < t.x + 15 && player.x + player.w > t.x - 15 && player.y < ry + 15 && player.y + player.h > ry - 15) {
            t.collected = true; totalTreats++; updateHUD();
        }
    });
}

function handleEnemies() {
    enemies.forEach(e => {
        e.update();
        e.draw();
        if (e.scared) return;
        if (player.x < e.x + e.w && player.x + player.w > e.x && player.y < e.y + e.h && player.y + player.h > e.y) {
            if (player.vy > 0 && player.y + player.h - player.vy <= e.y + 8) {
                e.scareAway();
                player.vy = player.jumpPower * 0.8; 
                totalTreats += 5; 
                updateHUD();
            } else if (player.invincibleTimer <= 0) {
                loseLife();
            }
        }
    });
}

function drawFinishLine() {
    let rx = finishLine.x - cameraX;
    ctx.fillStyle = '#e74c3c'; ctx.fillRect(rx, finishLine.y, finishLine.w, finishLine.h);
    ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.moveTo(rx - 10, finishLine.y); ctx.lineTo(rx + finishLine.w / 2, finishLine.y - 30); ctx.lineTo(rx + finishLine.w + 10, finishLine.y); ctx.fill();
    ctx.fillStyle = '#2c3e50'; ctx.beginPath(); ctx.arc(rx + finishLine.w / 2, finishLine.y + finishLine.h, 18, Math.PI, 0); ctx.fill();
    if (player.x + player.w > finishLine.x && player.x < finishLine.x + finishLine.w) {
        if (currentLevel < maxLevels) showLevelClear(); else showGameWin();
    }
}

// --- GAME LOOP ---
function gameLoop() {
    if (gameState === 'PLAYING') {
        player.update();
        cameraX = player.x - 200;
        if (cameraX < 0) cameraX = 0;
        if (cameraX > levelWidth - canvas.width) cameraX = levelWidth - canvas.width;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawParallaxBackground();
        drawPlatforms();
        drawTreats();
        handleEnemies();
        drawFinishLine();
        player.draw();
    }
    requestAnimationFrame(gameLoop);
}

// --- STATE MANAGEMENT ---
function startGame() {
    totalTreats = 0; playerLives = 5; currentLevel = 1; updateHUD();
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('end-screen').classList.add('hidden');
    loadLevel(currentLevel);
    gameState = 'PLAYING';
}

function loadLevel(lvl) {
    updateHUD();
    generateLevel();
}

function showLevelClear() {
    gameState = 'LEVEL_CLEAR';
    document.getElementById('level-title').innerText = `Level ${currentLevel} Complete!`;
    document.getElementById('level-desc').innerText = `You've collected ${totalTreats} treats! Ready for the next world?`;
    document.getElementById('level-screen').classList.remove('hidden');
}

function nextLevel() {
    currentLevel++;
    document.getElementById('level-screen').classList.add('hidden');
    loadLevel(currentLevel);
    gameState = 'PLAYING';
}

function showGameOver() {
    gameState = 'GAME_OVER';
    document.getElementById('end-desc').innerText = `You ran out of lives! Total treats: ${totalTreats}`;
    document.getElementById('end-screen').classList.remove('hidden');
}

function showGameWin() {
    gameState = 'WIN';
    document.getElementById('end-title').innerText = `🐾 You Win! 🐾`;
    document.getElementById('end-desc').innerText = `Amazing! Finished all 10 levels with ${totalTreats} treats!`;
    document.getElementById('end-screen').classList.remove('hidden');
}

function restartGame() {
    startGame();
}

requestAnimationFrame(gameLoop);

</script>
</body>
</html>
